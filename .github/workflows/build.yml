name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project GoreBlood.xcodeproj -scheme GoreBlood -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/GoreBlood.app Payload/
          zip -r GoreBlood.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CaughtStrike.ip
          path: CaughtStrike.ipa
